<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vetta — Diario digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFECE4;
    --paper-raised:#F8F6F0;
    --ink:#181818;
    --ink-soft:#4B4843;
    --line:#CFC9BB;
    --crimson:#A32B24;
    --gold:#8A6A2B;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans', Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.5;
  }

  a{color:inherit;text-decoration:none;}

  .topbar{
    background:var(--ink);
    color:var(--paper-raised);
    font-family:var(--sans);
    font-size:12.5px;
    padding:6px 24px;
    display:flex;
    justify-content:space-between;
    letter-spacing:.02em;
  }
  .topbar span{opacity:.75;}

  header.masthead{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 14px;
    text-align:center;
  }
  .masthead .fecha{
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(42px,7vw,74px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead .lema{
    font-family:var(--serif);
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin-top:6px;
  }

  nav.secciones{
    border-top:2px solid var(--ink);
    border-bottom:1px solid var(--ink);
    max-width:1180px;
    margin:14px auto 0;
    padding:10px 24px;
    display:flex;
    gap:26px;
    flex-wrap:wrap;
    font-family:var(--sans);
    font-weight:600;
    font-size:13.5px;
  }
  nav.secciones a{
    color:var(--ink);
    padding-bottom:2px;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  nav.secciones a:hover{border-bottom-color:var(--crimson);}
  nav.secciones a.activa{border-bottom-color:var(--crimson);color:var(--crimson);}

  main{
    max-width:1180px;
    margin:0 auto;
    padding:30px 24px 60px;
  }

  .etiqueta{
    font-family:var(--sans);
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--crimson);
    display:inline-block;
    margin-bottom:6px;
  }
  .etiqueta.gold{color:var(--gold);}

  .portada{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:36px;
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
    margin-bottom:30px;
  }
  .destacada img{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    display:block;
    background:var(--line);
  }
  .destacada h2{
    font-size:clamp(28px,3.4vw,40px);
    line-height:1.12;
    margin:12px 0 10px;
    cursor:pointer;
  }
  .destacada h2:hover{color:var(--crimson);}
  .destacada p.bajada{
    color:var(--ink-soft);
    font-size:17px;
    margin:0 0 10px;
  }
  .meta{
    font-family:var(--sans);
    font-size:12px;
    color:var(--ink-soft);
  }

  .secundarias{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .secundarias article{
    display:flex;
    gap:14px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .secundarias article:last-child{border-bottom:none;padding-bottom:0;}
  .secundarias img{
    width:104px;
    height:78px;
    object-fit:cover;
    flex-shrink:0;
    background:var(--line);
  }
  .secundarias h3{
    font-size:16.5px;
    line-height:1.25;
    margin:0 0 6px;
    cursor:pointer;
  }
  .secundarias h3:hover{color:var(--crimson);}

  .cuerpo{
    display:grid;
    grid-template-columns:2.2fr 1fr;
    gap:44px;
  }

  .grid-noticias{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px 32px;
  }
  .tarjeta img{
    width:100%;
    aspect-ratio:3/2;
    object-fit:cover;
    background:var(--line);
    margin-bottom:10px;
  }
  .tarjeta h3{
    font-size:18px;
    line-height:1.28;
    margin:0 0 8px;
    cursor:pointer;
  }
  .tarjeta h3:hover{color:var(--crimson);}
  .tarjeta p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0 0 8px;
  }

  h2.titulo-seccion{
    font-family:var(--sans);
    font-weight:700;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    border-bottom:2px solid var(--ink);
    padding-bottom:8px;
    margin:0 0 22px;
  }

  aside{
    border-left:1px solid var(--line);
    padding-left:32px;
  }
  .mas-leidas{list-style:none;margin:0;padding:0;}
  .mas-leidas li{
    display:flex;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .mas-leidas li:first-child{padding-top:0;}
  .mas-leidas .num{
    font-family:var(--serif);
    font-weight:700;
    font-size:26px;
    color:var(--line);
    line-height:1;
  }
  .mas-leidas h4{
    font-size:15px;
    line-height:1.3;
    margin:0;
  }
  .mas-leidas li:hover h4{color:var(--crimson);}

  .boletin{
    margin-top:34px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:22px;
  }
  .boletin h4{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 6px;
  }
  .boletin p{
    font-family:var(--sans);
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .boletin input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    font-family:var(--sans);
    font-size:13px;
    margin-bottom:8px;
    background:#fff;
  }
  .boletin button{
    width:100%;
    padding:10px;
    background:var(--ink);
    color:var(--paper-raised);
    border:none;
    font-family:var(--sans);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .boletin button:hover{background:var(--crimson);}

  .vista-articulo{display:none;}
  .vista-articulo.activa{display:block;}
  .vista-portada.oculta{display:none;}

  .volver{
    font-family:var(--sans);
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    display:inline-block;
    margin-bottom:20px;
  }
  .volver:hover{color:var(--crimson);}

  .articulo-full{
    max-width:760px;
    margin:0 auto;
  }
  .articulo-full h1{
    font-size:clamp(30px,4.2vw,44px);
    line-height:1.15;
    margin:10px 0 14px;
  }
  .articulo-full .bajada{
    font-size:19px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .articulo-full .meta{
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .articulo-full img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    background:var(--line);
    margin-bottom:10px;
  }
  .articulo-full .pie-img{
    font-family:var(--sans);
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .articulo-full .cuerpo-texto p{
    font-size:18.5px;
    line-height:1.7;
    margin:0 0 20px;
  }
  .articulo-full .cuerpo-texto p:first-of-type::first-letter{
    font-size:56px;
    font-weight:700;
    float:left;
    line-height:.8;
    padding:6px 8px 0 0;
    color:var(--crimson);
  }

  footer{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    font-size:12.5px;
    padding:30px 24px;
    margin-top:40px;
  }
  footer .contenido{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    opacity:.8;
  }

  @media (max-width:820px){
    .portada,.cuerpo{grid-template-columns:1fr;}
    aside{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:26px;margin-top:10px;}
    .grid-noticias{grid-template-columns:1fr;}
    nav.secciones{gap:16px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <span id="fecha-hoy"></span>
  <span>Edición digital</span>
</div>

<header class="masthead">
  <div class="fecha">Santiago, Chile</div>
  <h1>Vetta</h1>
  <div class="lema">Información verificada, todos los días</div>
</header>

<nav class="secciones" id="nav-secciones"></nav>

<main>

  <!-- ================= VISTA PORTADA ================= -->
  <div class="vista-portada" id="vista-portada">
    <section class="portada" id="portada"></section>

    <div class="cuerpo">
      <div>
        <h2 class="titulo-seccion">Últimas noticias</h2>
        <div class="grid-noticias" id="grid-noticias"></div>
      </div>

      <aside>
        <h2 class="titulo-seccion">Lo más leído</h2>
        <ul class="mas-leidas" id="mas-leidas"></ul>

        <div class="boletin">
          <h4>Recibe el boletín</h4>
          <p>Las noticias más importantes cada mañana en tu correo.</p>
          <input type="email" placeholder="tu@correo.com">
          <button type="button">Suscribirme</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- ================= VISTA ARTÍCULO ================= -->
  <div class="vista-articulo" id="vista-articulo">
    <span class="volver" onclick="mostrarPortada()">&larr; Volver a portada</span>
    <article class="articulo-full" id="articulo-contenido"></article>
  </div>

</main>

<footer>
  <div class="contenido">
    <span>&copy; <span id="anio"></span> Vetta — Comprometidos con la verdad</span>
    <span>Contacto · Quiénes somos · Aviso legal</span>
  </div>
</footer>

<script>
const NOTICIAS = [
  {
    id: "kimi-antonelli-lidera-f1",
    categoria: "Automovilismo",
    titulo: "El imperio de Kimi Antonelli: La historia de la joven promesa que domina la Fórmula 1",
    bajada: "A sus 20 años, el piloto italiano acumula ocho victorias en la temporada 2026 y encabeza el Mundial con Mercedes, confirmando el talento que demostró desde sus inicios en el karting.",
    autor: "Catalina Paredes",
    fecha: "19 de septiembre de 2026",
    imagen: "https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQOUQ9L3ovHR6Ii2snybZe-2V3CZgVStzB4m_fmw4UxTlIf38-h",
    imagenes: [
      "https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQOUQ9L3ovHR6Ii2snybZe-2V3CZgVStzB4m_fmw4UxTlIf38-h",
      "https://images.sipse.com/B0lbu5u-FBO1kdDn46PmSqjsA7o=/856x748/smart/filters:format(webp)/2026/09/06/1788731549723.jpg",
      "https://pbs.twimg.com/media/D3Tcb9IXsAMP1P2?format=webp&name=large"
    ],
    destacada: true,
    elementos: [
      { 
        tipo: "texto", 
        contenido: "A sus 20 años, el piloto italiano acumula ocho victorias en la temporada 2026 y encabeza el Mundial con Mercedes, confirmando el talento que demostró desde sus inicios en el karting." 
      },
      { 
        tipo: "texto", 
        contenido: "La historia de Andrea Kimi Antonelli comenzó en la ciudad de Bolonia donde creció en una familia con mucha pasión por el automovilismo gracias a su padre Marco Antonelli, un entorno que despertó en él un interés muy temprano por las carreras." 
      },
      { 
        tipo: "imagen", 
        index: 1, 
        pie: "Antonelli celebrando en un momento clave de la temporada." 
      },
      { 
        tipo: "texto", 
        contenido: "Al dar el salto definitivo hacia los monoplazas de fórmula sus resultados fueron claros y aceleraron sus etapas de desarrollo al consagrarse campeón de la Fórmula 4 Italiana." 
      },
      { 
        tipo: "imagen", 
        index: 2, 
        pie: "Registro exclusivo de la joven promesa del automovilismo." 
      },
      { 
        tipo: "texto", 
        contenido: "Tras dar el paso directo al equipo principal de Mercedes en la Fórmula 1 sin pasar por un proceso prolongado de adaptación, el piloto italiano construyó un presente increíble." 
      }
    ]
  }
];

// Fecha y año automáticos
const hoy = new Date();
document.getElementById("fecha-hoy").textContent =
  hoy.toLocaleDateString("es-CL", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
document.getElementById("anio").textContent = hoy.getFullYear();

// Navegación por categorías
const categorias = ["Portada", ...new Set(NOTICIAS.map(n => n.categoria))];
const nav = document.getElementById("nav-secciones");
categorias.forEach((cat, i) => {
  const a = document.createElement("a");
  a.textContent = cat;
  if (i === 0) a.classList.add("activa");
  a.addEventListener("click", () => {
    document.querySelectorAll("nav.secciones a").forEach(el => el.classList.remove("activa"));
    a.classList.add("activa");
    mostrarPortada();
    renderizarPortada(cat === "Portada" ? null : cat);
  });
  nav.appendChild(a);
});

function tarjetaHTML(n, tipo) {
  if (tipo === "secundaria") {
    return `
      <article onclick="abrirArticulo('${n.id}')">
        <img src="${n.imagen}" alt="${n.titulo}">
        <div>
          <span class="etiqueta">${n.categoria}</span>
          <h3>${n.titulo}</h3>
          <div class="meta">${n.autor}</div>
        </div>
      </article>`;
  }
  return `
    <div class="tarjeta" onclick="abrirArticulo('${n.id}')">
      <img src="${n.imagen}" alt="${n.titulo}">
      <span class="etiqueta">${n.categoria}</span>
      <h3>${n.titulo}</h3>
      <p>${n.bajada}</p>
      <div class="meta">${n.autor} · ${n.fecha}</div>
    </div>`;
}

function renderizarPortada(filtroCategoria) {
  const lista = filtroCategoria
    ? NOTICIAS.filter(n => n.categoria === filtroCategoria)
    : NOTICIAS;

  const destacada = filtroCategoria
    ? lista[0]
    : (NOTICIAS.find(n => n.destacada) || NOTICIAS[0]);

  if (!destacada) return;

  const resto = lista.filter(n => n.id !== destacada.id);

  document.getElementById("portada").innerHTML = `
    <div class="destacada" onclick="abrirArticulo('${destacada.id}')">
      <img src="${destacada.imagen}" alt="${destacada.titulo}">
      <span class="etiqueta">${destacada.categoria}</span>
      <h2>${destacada.titulo}</h2>
      <p class="bajada">${destacada.bajada}</p>
      <div class="meta">${destacada.autor} · ${destacada.fecha}</div>
    </div>
    <div class="secundarias">
      ${resto.slice(0, 3).map(n => tarjetaHTML(n, "secundaria")).join("")}
    </div>
  `;

  const noticiasGrid = resto.length >= 3 ? resto.slice(3) : resto.slice(1);
  document.getElementById("grid-noticias").innerHTML =
    noticiasGrid.map(n => tarjetaHTML(n, "grid")).join("") || `<p style="color:var(--ink-soft); font-family:var(--sans);">No hay más noticias en esta sección por el momento.</p>`;

  const masLeidas = NOTICIAS.filter(n => n.id !== destacada.id).slice(0, 5);
  document.getElementById("mas-leidas").innerHTML = masLeidas.map((n, i) => `
    <li onclick="abrirArticulo('${n.id}')">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <h4>${n.titulo}</h4>
    </li>
  `).join("");
}

function abrirArticulo(id) {
  const n = NOTICIAS.find(a => a.id === id);
  if (!n) return;

  let contenidoHTML = "";

  // Lee los elementos estructurados (textos e imágenes intercaladas)
  if (n.elementos && Array.isArray(n.elementos)) {
    contenidoHTML = n.elementos.map(el => {
      if (el.tipo === "texto") {
        return `<p>${el.contenido}</p>`;
      } else if (el.tipo === "imagen" && n.imagenes && n.imagenes[el.index]) {
        return `
          <div style="margin: 25px 0;">
            <img src="${n.imagenes[el.index]}" alt="Imagen de la noticia" style="width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--line);">
            <div class="pie-img" style="margin-top: 6px;">${el.pie || "Imagen referencial."}</div>
          </div>
        `;
      }
      return "";
    }).join("");
  } 
  // O lee el cuerpo tradicional si alguna noticia no tiene elementos
  else if (n.cuerpo && Array.isArray(n.cuerpo)) {
    contenidoHTML = n.cuerpo.map(p => `<p>${p}</p>`).join("");
  }

  document.getElementById("articulo-contenido").innerHTML = `
    <span class="etiqueta ${n.categoria === 'Economía' ? 'gold' : ''}">${n.categoria}</span>
    <h1>${n.titulo}</h1>
    <p class="bajada">${n.bajada}</p>
    <div class="meta">Por ${n.autor} · ${n.fecha}</div>
    <br>
    <img src="${n.imagen}" alt="${n.titulo}">
    <div class="pie-img">Imagen de portada.</div>
    <div class="cuerpo-texto">
      ${contenidoHTML}
    </div>
  `;

  document.getElementById("vista-portada").classList.add("oculta");
  document.getElementById("vista-articulo").classList.add("activa");
  window.scrollTo({top:0, behavior:"smooth"});
}

function mostrarPortada() {
  document.getElementById("vista-articulo").classList.remove("activa");
  document.getElementById("vista-portada").classList.remove("oculta");
  window.scrollTo({top:0, behavior:"smooth"});
}

// Primera carga
renderizarPortada(null);
</script>

</body>
</html>
